<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0dc" />
    <title>HeritageLens Project Demo</title>
    <style>
      :root {
        color: #2b2a25;
        background: #f5f0dc;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(225, 157, 146, 0.2), transparent 34rem),
          #f5f0dc;
      }

      main {
        width: min(1040px, 100%);
      }

      header {
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #a45f52;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.65rem, 4vw, 2.7rem);
        line-height: 1.12;
      }

      .player {
        overflow: hidden;
        border: 1px solid #cfc6b5;
        border-radius: 18px;
        background: #171815;
        box-shadow: 0 18px 50px rgba(43, 42, 37, 0.16);
      }

      video {
        display: block;
        width: 100%;
        max-height: min(72vh, 720px);
        background: #171815;
      }

      .note {
        margin: 14px 2px 0;
        color: #666159;
        font-size: 0.92rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">SURF 2026 · Project Demo</p>
        <h1>HeritageLens</h1>
      </header>

      <div class="player">
        <video autoplay muted controls playsinline webkit-playsinline preload="metadata">
          <source src="/project-demo.mp4" type="video/mp4" />
          Your browser does not support HTML5 video playback.
        </video>
      </div>

      <p class="note">The video starts muted where automatic playback is supported. Use the player controls to enable sound or enter full screen.</p>
    </main>
  </body>
</html>
